[pytest]
# E2E tests live in tests/e2e/ and are excluded from normal runs.
# Run unit tests only:   pytest tests/
# Run E2E tests only:    pytest tests/e2e/ -m e2e  (requires: server on :8080)
norecursedirs = .git .venv __pycache__ e2e

markers =
    e2e: End-to-end browser tests; require a running server on localhost:8080.
         Run with: pytest tests/e2e/ -m e2e
         Skip with: pytest tests/  (default; e2e directory excluded via norecursedirs)
