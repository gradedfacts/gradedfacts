<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradedFacts</title>
  <link rel="stylesheet" href="/static/styles/main.css">
  <!--
    HTMX handles form submission, polling, and partial HTML swaps.
    No SPA framework — the server renders all state transitions.
  -->
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-wordmark"><svg width="20" height="18" viewBox="0 0 20 18" fill="none" aria-hidden="true" style="display:inline-block;vertical-align:middle;margin-right:0.35em"><rect x="0"  y="4"  width="4" height="14" rx="1" fill="#22c55e"/><rect x="5"  y="0"  width="4" height="18" rx="1" fill="#f59e0b"/><rect x="10" y="9"  width="4" height="9"  rx="1" fill="#9ca3af"/><rect x="15" y="6"  width="4" height="12" rx="1" fill="#ef4444"/></svg>GradedFacts</a>
    <span class="site-tagline">
      Politically independent &middot; No party funding &middot; No ideological agenda
    </span>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Hosted in Switzerland &middot; No US Cloud Act jurisdiction</span>
    <span>
      <a href="/methodology">Open Source Methodology</a>
      &middot;
      <a href="https://github.com/gradedfacts/gradedfacts" target="_blank" rel="noopener">Source Code</a>
    </span>
    <span>Powered by Claude (Anthropic) + Mistral (France) &middot; Brave Search independent index</span>
  </footer>
</body>
</html>
